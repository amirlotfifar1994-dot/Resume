<style id="i18n-style">
/* ===== Bilingual (EN/IT) ===== */
.lang-switch{
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 20000;
  display: inline-flex;
  gap: 6px;
  padding: 6px;
  border-radius: 999px;

  /* Glassy base (fallback) */
  border: 1px solid rgba(15,23,42,0.18);
  background: linear-gradient(180deg, rgba(255,255,255,0.86), rgba(255,255,255,0.72));
  color: inherit;
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  box-shadow: 0 16px 44px rgba(2,6,23,0.18), inset 0 1px 0 rgba(255,255,255,0.55);
}
.lang-switch .lang-btn{
  border: 0;
  background: transparent;
  padding: 7px 10px;
  border-radius: 999px;
  font: 800 12px/1 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  letter-spacing: 0.2px;
  cursor: pointer;
  opacity: 0.84;
  color: rgba(15,23,42,0.82);
  transition: background 180ms ease, opacity 180ms ease, transform 180ms ease;
}
.lang-switch .lang-btn:active{ transform: scale(0.98); }
.lang-switch .lang-btn:focus-visible{
  outline: 2px solid rgba(37,99,235,0.38);
  outline-offset: 2px;
}
.lang-switch .lang-btn[aria-pressed="true"]{
  background: rgba(37,99,235,0.18);
  opacity: 1;
  color: rgba(15,23,42,0.92);
}

@media (prefers-color-scheme: dark){
  .lang-switch{
    border-color: rgba(226,232,240,0.22);
    background: linear-gradient(180deg, rgba(2,6,23,0.82), rgba(2,6,23,0.68));
    box-shadow: 0 18px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .lang-switch .lang-btn{ color: rgba(226,232,240,0.86); }
  .lang-switch .lang-btn[aria-pressed="true"]{
    background: rgba(124,58,237,0.30);
    color: rgba(255,255,255,0.96);
  }
}

/* Theme-aware (dashboards use CSS vars + .light class) */
@supports (color: hsl(var(--background) / 1)){
  .lang-switch{
    border-color: hsl(var(--border) / 0.55);
    background: linear-gradient(180deg, hsl(var(--card) / 0.92), hsl(var(--card) / 0.78));
    box-shadow: 0 18px 55px hsl(var(--background) / 0.35), inset 0 1px 0 hsl(var(--foreground) / 0.10);
  }
  html:not(.light) .lang-switch{
    background: linear-gradient(180deg, hsl(var(--card) / 0.82), hsl(var(--card) / 0.68));
    box-shadow: 0 20px 60px hsl(0 0% 0% / 0.42), inset 0 1px 0 hsl(var(--foreground) / 0.08);
  }
  .lang-switch .lang-btn{
    color: hsl(var(--foreground) / 0.86);
    opacity: 0.86;
  }
  .lang-switch .lang-btn:focus-visible{
    outline-color: hsl(var(--ring) / 0.55);
  }
  .lang-switch .lang-btn[aria-pressed="true"]{
    background: linear-gradient(180deg, hsl(var(--primary) / 0.32), hsl(var(--primary) / 0.18));
    color: hsl(var(--primary-foreground) / 1);
    box-shadow: inset 0 1px 0 hsl(var(--primary-foreground) / 0.18);
    opacity: 1;
  }
  html:not(.light) .lang-switch .lang-btn[aria-pressed="true"]{
    background: linear-gradient(180deg, hsl(var(--primary) / 0.40), hsl(var(--primary) / 0.22));
  }
}
</style>
