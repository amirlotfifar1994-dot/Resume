a{color:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}.topbar{position:sticky;top:0;z-index:50;background:rgba(248,244,236,.84);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
