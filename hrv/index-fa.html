<style id="i18n-style">
/* ===== Bilingual (EN/IT) ===== */
.lang-switch{
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 20000;
  display: inline-flex;
  gap: 6px;
  padding: 6px;
  border-radius: 999px;

}

  background: transparent;
  padding: 7px 10px;
  border-radius: 999px;
  font: 800 12px/1 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  letter-spacing: 0.2px;
  cursor: pointer;
  opacity: 0.84;
  color: rgba(15,23,42,0.82);
  transition: background 180ms ease, opacity 180ms ease, transform 180ms ease;
}
.lang-switch .lang-btn:active{ transform: scale(0.98); }
.lang-switch .lang-btn:focus-visible{
  outline: 2px solid rgba(37,99,235,0.38);

}
.lang-switch .lang-btn[aria-pressed="true"]{
  background: rgba(37,99,235,0.18);

<script>
(function(){
  const KEY = 'hrv_testmode_banner_dismissed';
  const banner = document.querySelector('.testmode-banner');
  if(!banner) return;

  function applyHidden(){
    banner.style.display = 'none';
    document.documentElement.style.setProperty('--banner-h','0px');
  }

  try{
    if(window.localStorage && window.localStorage.getItem(KEY)==='1'){
      applyHidden();
      return;
    }
  }catch(_){}

  const btn = banner.querySelector('.testmode-close');
  if(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault();
      applyHidden();
      try{ window.localStorage && window.localStorage.setItem(KEY,'1'); }catch(_){}
    });
  }
})();
</script>
